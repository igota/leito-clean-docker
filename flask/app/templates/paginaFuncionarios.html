{% extends "base.html" %}

{% block content %}
    <title>Leito Clean - Funcionários</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/paginaFuncionarios.css') }}">

  


<div class="container">
    <h2 class="titulo-pagina">Funcionários</h2>

    <!-- 🔍 Filtros -->
    <div class="card mb-4">
        <div class="seletores">
            <form id="formBusca" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Nome</label>
                    <input type="text" id="nomeBusca" class="form-control" placeholder="Digite o nome...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">ID Cartão</label>
                    <input type="text" id="idCartaoBusca" class="form-control" placeholder="Digite o ID Cartão...">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tipo</label>
                    <select id="tipoBusca" class="form-select">
                        <option value="">Todos</option>
                        <option value="asg">ASG</option>
                        <option value="enfermagem">Enfermagem</option>
                        
                    </select>
                </div>
                  <div class="botoes">
                      <button type="submit" class="btn btn-primary w-100">
                          <i class="bi bi-search"></i> Buscar
                      </button>
                      <button type="button" class="btn btn-outline-danger w-100" onclick="limparConsulta()">
                          <i class="bi bi-x-circle"></i> Limpar
                      </button>
                      <button type="button"   class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#modalCadastro">
                      <i class="bi bi-plus-circle"></i> Novo Funcionário
                      </button>
                      
                  </div>


            </form>
        </div>
    </div>



    <!-- 📋 Tabela -->
    <div class="tabela-container">
      <table class="table table-striped table-bordered" id="tabelaFuncionarios">
        <thead class="table-dark">
            <tr>
                
                <th>Nome</th>
                <th>CPF</th>
                <th>ID CARTÃO</th>
                <th>Tipo</th>
                <th>Status</th>
                <th></th>
                
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>
    

<!-- Menu de Navegação Fixo (inicialmente escondido) -->
<div class="pagination-fixed" id="paginationFixed">
  <div class="pagination-container">
      <div class="pagination-info" id="paginationInfo"></div>
      <div class="pagination-controls" id="paginationControls"></div>

      <div class="pagination-size-selector">
          <label for="itemsPerPageFixed">Itens/página:</label>
          <select id="itemsPerPageFixed" class="form-select form-select-sm">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="20">20</option>
              <option value="50">50</option>
          </select>
      </div>
  </div>
</div>




    

</div>

<!-- 🪟 Modal de Cadastro -->
<div class="modal fade" id="modalCadastro" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Cadastrar Novo Funcionário</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <!-- ✅ onsubmit agora impede reload e chama salvarFuncionario(event) -->
        <form id="formCadastro" onsubmit="salvarFuncionario(event)">
          <!-- 🔔 Alerta dinâmico -->
          <div id="alertCadastro" style="display:none;" class="alert alert-danger py-2"></div>
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" id="nome" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" id="cpf" class="form-control" maxlength="14" placeholder="000.000.000-00" required>
          </div>

          <div class="mb-3">
            <label class="form-label">ID Cartão</label>
            <input
              id="id_cartao"
              class="form-control"
              type="text"
              inputmode="numeric"
              pattern="^\d{8,10}$"
              maxlength="10"
              minlength="8"
              oninput="this.value = this.value.replace(/\D/g, '')"
              required
            />


          </div>

          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select id="tipo" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="asg">ASG</option>
              <option value="enfermagem">Enfermagem</option>
            </select>
          </div>

          <!-- ✅ Botões dentro do form -->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>



<!-- 🪟 Modal de Edição -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Funcionário</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formEditarFuncionario" onsubmit="salvarEdicao(event)">
          <!-- 🔔 Alerta dinâmico -->
          <div id="alertEdicao" style="display:none;" class="alert alert-danger py-2"></div>

          <input type="hidden" id="editId">

          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" id="editNome" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text" id="editCpf" class="form-control" maxlength="14">
          </div>
          <div class="mb-3">
            <label class="form-label">ID Cartão</label>
            <input
              id="editIdcartao"
              class="form-control"
              type="text"
              inputmode="numeric"
              pattern="^\d{8,10}$"
              maxlength="10"
              minlength="8"
              required
            />

          </div>
          <div class="mb-3">
            <label class="form-label">Tipo</label>
            <select id="editTipo" class="form-select" required>
              <option value="">Selecione...</option>
              <option value="asg">ASG</option>
              <option value="enfermagem">Enfermagem</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label d-block">Status</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="editAtivo" id="editAtivo1" value="1">
              <label class="form-check-label" for="editAtivo1">Ativo</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="editAtivo" id="editAtivo0" value="0">
              <label class="form-check-label" for="editAtivo0">Inativo</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>


<script src="{{ url_for('static', filename='js/paginaFuncionarios.js') }}"></script>

<!-- Container para os Toasts -->

<div id="toastContainer" class="position-fixed top-50 start-50 translate-middle p-3" style="z-index: 2000;"></div>




{% endblock %}
