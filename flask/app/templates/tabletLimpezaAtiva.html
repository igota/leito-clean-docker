<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Limpeza em andamento</title>
    <link rel="stylesheet" href="/static/css/tabletLimpezaAtiva.css">
</head>
<body>
    <!-- Container principal para os cards -->
    <div id="containerLimpezas" class="cards-container"></div>

    <!-- Popup ID Cartão do Enfermeiro -->
    <div id="popupFinalizar" class="popup oculto">
        <div class="popup-conteudo">
            <span class="fechar-popup" data-close="popupFinalizar" id="fecharFinalizar">✖</span>
            <h3>Enfermeiro(a)</h3>
            <p>Aproxime o cartão do leitor</p>
            <input 
                id="idcartaoFinalizarInput"
                type="text"
                class="form-control"
                maxlength="10"
                minlength="9"
                pattern="^\d{9,10}$"
                inputmode="none"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                required
            >
        </div>      
    </div>

    <!-- Popup Leitor de Cartão do Enfermeiro -->
    <div id="popupLeitorEnfermeiro" class="popup oculto">
        <div class="popup-conteudo">
            <span class="fechar-popup" id="fecharLeitorEnfermeiro">✖</span>
            
            <!-- Imagem/ícone do leitor sendo bipado -->
            <div class="leitor-imagem">
                <!-- Retângulo preto vertical com LED -->
                <div class="leitor-retangulo">
                    <div class="led-vermelho"></div>
                    <!-- Opcional: texto RFID no leitor -->
                    <div class="leitor-texto">LEITOR</div>
                </div>
                <div class="onda-radio"></div>
                <div class="cartao-bipando">🪪</div>
            </div>
            
            <h3>Enfermeiro(a)</h3>
            <p class="mensagem-leitor">Aproxime o cartão do leitor</p>
            
            
            <!-- Input oculto visualmente -->
            <input 
                id="idcartaoEnfermeiroOculto"
                type="text"
                class="input-oculto"
                maxlength="10"
                minlength="9"
                pattern="^\d{9,10}$"
                inputmode="none"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                required
            />
        </div>      
    </div>

        <!-- Popup de confirmação do Enfermeiro -->
    <div id="popupConfirmacao" class="popup oculto">
        <div class="popup-conteudo">
            
            <h3 id="mensagemConfirmacao"></h3>
            <div class="botoes-confirmacao">
                <button id="confirmarFim">Confirmar</button>
                <button id="cancelarFim">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Popup de mensagens confirma Enfermeiro-->
    <div id="popupMensagem" class="popup-mensagem oculto">
        <div class="popup-conteudo">
            <div class="popup-icone" id="popupIcone">⚠️</div>
            <p id="mensagemTexto"></p>
            <button id="btnIntervaloAlmocoJanta" class="oculto">Intervalo Almoço / Janta</button>
            <button id="fecharMensagemBtn">OK</button>
        </div>
    </div>

    <!-- Popup Leitor de Cartão do ASG (Intervalo Almoço/Janta) -->
    <div id="popupLeitorIntervalo" class="popup oculto">
        <div class="popup-conteudo">
            <span class="fechar-popup" id="fecharLeitorIntervalo">✖</span>

            <!-- Imagem/ícone do leitor sendo bipado -->
            <div class="leitor-imagem">
                <div class="leitor-retangulo">
                    <div class="led-vermelho"></div>
                    <div class="leitor-texto">LEITOR</div>
                </div>
                <div class="onda-radio"></div>
                <div class="cartao-bipando">🪪</div>
            </div>

            <h3>Intervalo Almoço/Janta</h3>
            <p class="mensagem-leitor">Aproxime o cartão do ASG que iniciou a limpeza</p>

            <!-- Input oculto visualmente -->
            <input
                id="idcartaoIntervaloOculto"
                type="text"
                class="input-oculto"
                maxlength="10"
                minlength="9"
                pattern="^\d{9,10}$"
                inputmode="none"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                required
            />
        </div>
    </div>

    <!-- Popup Leitor de Cartão do ASG (finalizar) -->
    <div id="popupLeitorASGFinalizar" class="popup oculto">
        <div class="popup-conteudo">
            <span class="fechar-popup" id="fecharLeitorASGFinalizar">✖</span>

            <!-- Imagem/ícone do leitor sendo bipado -->
            <div class="leitor-imagem">
                <div class="leitor-retangulo">
                    <div class="led-vermelho"></div>
                    <div class="leitor-texto">LEITOR</div>
                </div>
                <div class="onda-radio"></div>
                <div class="cartao-bipando">🪪</div>
            </div>

            <h3>ASG</h3>
            <p class="mensagem-leitor">Aproxime o cartão do leitor para finalizar</p>

            <!-- Input oculto visualmente -->
            <input
                id="idcartaoASGFinalizarOculto"
                type="text"
                class="input-oculto"
                maxlength="10"
                minlength="9"
                pattern="^\d{9,10}$"
                inputmode="none"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                required
            />
        </div>
    </div>

    <!-- Popup de Confirmação de Finalização (ASG) -->
    <div id="popupConfirmacaoFinalizar" class="popup oculto">
        <div class="popup-conteudo">
            <span class="fechar-popup" data-close="popupConfirmacaoFinalizar" id="fecharConfirmacaoFinalizar">✖</span>
            <h3>Confirmar Finalização</h3>
            <div class="confirmacao-info">
                <p class="confirmacao-tempo" id="confirmacaoTempo"></p>
                <p class="confirmacao-mensagem" id="confirmacaoMensagem"></p>
            </div>
            <div class="botoes-confirmacao-finalizar">
                <button id="confirmarFinalizarBtn" class="btn-confirmar">Confirmar</button>
                <button id="cancelarFinalizarBtn" class="btn-cancelar">Cancelar</button>
                
            </div>
        </div>      
    </div>





    <script>
        window.TEMPO_MINIMO_LIMPEZA_PADRAO = {{ tempo_minimo_limpeza_padrao }};
        window.TEMPO_MINIMO_LIMPEZA_CENTRO_CIRURGICO = {{ tempo_minimo_limpeza_centro_cirurgico }};
    </script>
    <script src="/static/js/tabletLimpezaAtiva.js"></script>
</body>
</html>
