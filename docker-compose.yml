version: "3.9"

name: leito-clean

services:

  mysql:
    image: mysql:8.0
    container_name: leito-clean-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      --default-time-zone=-03:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - leito-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leito-clean-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --notify-keyspace-events KEA
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leito-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask:
    build: ./flask
    container_name: leito-clean-flask
    restart: unless-stopped

    # NÃO precisa expor porta para fora
    expose:
      - "8000"

    environment:
      IS_DOCKER: ${IS_DOCKER}
      FLASK_ENV: ${FLASK_ENV}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      SECRET_KEY: ${SECRET_KEY}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}

      BASE_URL: ${BASE_URL}

      USERNAME_VITAE: ${USERNAME_VITAE}
      PASSWORD_VITAE: ${PASSWORD_VITAE}

      ICONTROL_BASE_URL: ${ICONTROL_BASE_URL}
      ICONTROL_LOGIN: ${ICONTROL_LOGIN}
      ICONTROL_SENHA: ${ICONTROL_SENHA}

      INTERVALO_ATUALIZACAO: ${INTERVALO_ATUALIZACAO}

      TEMPO_MINIMO_LIMPEZA_PADRAO: ${TEMPO_MINIMO_LIMPEZA_PADRAO}
      TEMPO_MINIMO_LIMPEZA_CENTRO_CIRURGICO: ${TEMPO_MINIMO_LIMPEZA_CENTRO_CIRURGICO}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./flask:/app

    networks:
      - leito-network

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s


  nginx:
    image: nginx:alpine
    container_name: leito-clean-nginx
    restart: unless-stopped
    ports:
      - "80:80"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./flask/app/static:/app/static:ro
      - ./nginx/logs:/var/log/nginx

    depends_on:
      - flask

    networks:
      - leito-network


networks:
  leito-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data: